<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="bg-slate-400 p-6 grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

        <div class="bg-white hover:bg-gray-200 hover:shadow-xl hover:scale-105 rounded-lg p-4">
            <p>🎆</p>
            <h1 class="font-semibold">2.4K</h1>
            <p class="text-xs text-gray-500">Page Views</p>
        </div>

        <div class="bg-white hover:bg-gray-200 hover:shadow-xl hover:scale-105 rounded-lg p-4">
            <p>🧿</p>
            <h1 class="font-semibold">$8.5K</h1>
            <p class="text-xs text-gray-500">Revenue</p>
        </div>

        <div class="bg-white hover:bg-gray-200 hover:shadow-xl hover:scale-105 rounded-lg p-4">
            <p>👥</p>
            <h1 class="font-semibold">829</h1>
            <p class="text-xs text-gray-500">Users</p>
        </div>
        <div class="bg-white hover:bg-gray-200 hover:shadow-xl hover:scale-105 rounded-lg p-4">
            <p>⭐</p>
            <h1 class="font-semibold">4.8</h1>
            <p class="text-xs text-gray-500">Rating</p>
        </div>
    </div>
</body>

</html>
