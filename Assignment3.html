<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment III</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            margin: 20px 100px 150px 100px;

        }

        nav {
            background-color: black;
            color: aliceblue;
            /* position: fixed; */
            /* width: 100%;
            height: 50px; */
            justify-content: space-between;
            text-align: center;
            align-items: center;
            display: flex;
            padding: 10px;
            margin-bottom: 20px;
            margin-top: 20px;

        }

        /* p{
            margin-bottom: 20px;
        } */
        /* span{
            padding-left: 10px;
        } */
        a {
            color: aliceblue;
            text-decoration: none;

        }

        .myLogo {
            /* position: fixed; */
            display: flex;
            gap: 30px;
            /* justify-content: center; */

        }

        h4 {
            /* border: 1px solid black; */
            background-color: rgba(136, 199, 228, 0.5);
            border-radius: 5px;
            align-items: center;
            justify-content: center;
            display: flex;
            width: 300px;
            height: 50px;

        }

        .feature {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            margin-bottom: 20px;

        }

        .utility {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background-color: aliceblue;
            width: 700px;
            height: 300px;
            border: 0.2px solid gainsboro;
            border-radius: 5px;
            padding: 20px;
            /* margin-bottom: 20px; */

        }

        .innerbox {
            background-color: blue;
            width: 300px;
            height: 100px;
            /* height: 200px; */
            border: 1px solid gainsboro;
            padding: 20px;
            color: aliceblue;



        }

        .box {
            background-color: rgb(179, 216, 204);
            border: 1px dashed gainsboro;
            border-radius: 5px;
            width: 700px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* margin: 50px 20px 50px 20px; */
        }

        .container {
            display: flex;
            gap: 50px;
            margin-bottom: 20px;
        }

        button {
            background-color: rgba(18, 18, 218);
            padding: 10px;
            margin-left: 20px;
            color: aliceblue;

        }
    </style>
</head>

<body>
    <h1>CSS Utility Simulator</h1>
    <p>Change the inputs below to see how actomic classes combine to build Uls.</p>
    <nav>
        <h1>Mylogo</h1>
        <div class="myLogo">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </div>
    </nav>
    <div class="feature">
        <h4>Feature 1</h4>
        <h4>Feature 2</h4>
        <h4>Feature 3</h4>
    </div>
    <div class="container">
        <section class="utility">
            <h2>Utility Controls</h2>
            <label for="padding">Padding (Spacing)</label>
            <select name="name" id="padding">
                <option>Medium(p-8)</option>
            </select>
            <label for="color">Background Theme (Colors)</label>
            <select name="name" id="color">
                <option>Primary Blue</option>
            </select>
            <label for="textSize">Text Size (Typography)</label>
            <select name="name" id="textSize">
                <option>Large(text-x)</option>
            </select>
            <label for="corner">Corner Radius (Borders)</label>
            <select name="name" id="corner">
                <option>Square (rounded-none)</option>
            </select>
            <label for="shadow">Shadow (Depth)</label>
            <select name="name" id="shadow">
                <option>Medium(shadow-md)</option>
            </select>

        </section>
        <section class="box">
            <div class="innerbox">
                <h3>Alex Walker</h3>
                <p>Full-Stack Web Developer building awesome thinds with Tailwind CSS.</p>
            </div>
        </section>
    </div>
    <button type="submit">Sumit</button>
    <button>Hover Me Slowly</button>

</body>

</html>
