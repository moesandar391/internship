<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            /* height: 100vh; */
            margin-top: 200px;

        }

        .container {
            background-color: aqua;
            width: 300px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box2 {
            background-color: darkgoldenrod;
            /* width: 250px;
            height: 150px; */
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .card {
            border: 1px solid black;
            border-radius: 10px;
            padding: 30px;
            background-color: aliceblue;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box2">
            <h3 class="card">Card Content</h3>
        </div>
    </div>
</body>

</html>
